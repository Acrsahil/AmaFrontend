<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Compatibility Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .test-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .status {
            font-size: 14px;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
        }
        .pass { background: rgba(0, 255, 0, 0.2); }
        .fail { background: rgba(255, 0, 0, 0.2); }
        h1 { margin-top: 0; }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🧪 iPad Compatibility Test</h1>
    <p>Testing if your iPad Air 2 can run the app...</p>

    <div class="test-box">
        <h2>Device Info</h2>
        <div id="device-info"></div>
    </div>

    <div class="test-box">
        <h2>JavaScript Tests</h2>
        <div id="js-tests"></div>
    </div>

    <div class="test-box">
        <h2>Network Test</h2>
        <button onclick="testAPI()">Test Backend Connection</button>
        <div id="network-result"></div>
    </div>

    <div class="test-box">
        <h2>Console Logs</h2>
        <div id="console-output" style="font-size: 12px; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <script>
        // Capture console logs
        const consoleOutput = document.getElementById('console-output');
        const originalLog = console.log;
        const originalError = console.error;
        
        function addLog(type, ...args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            const div = document.createElement('div');
            div.textContent = `[${type}] ${msg}`;
            div.style.color = type === 'ERROR' ? '#ff6b6b' : '#4ecdc4';
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            addLog('LOG', ...args);
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            addLog('ERROR', ...args);
            originalError.apply(console, args);
        };

        // Device Info
        const deviceInfo = document.getElementById('device-info');
        deviceInfo.innerHTML = `
            <div class="status">User Agent: ${navigator.userAgent}</div>
            <div class="status">Platform: ${navigator.platform}</div>
            <div class="status">Screen: ${window.screen.width}x${window.screen.height}</div>
            <div class="status">Viewport: ${window.innerWidth}x${window.innerHeight}</div>
            <div class="status">Touch Support: ${('ontouchstart' in window) ? 'Yes' : 'No'}</div>
            <div class="status">iOS Version: ${/OS (\d+)_/.exec(navigator.userAgent)?.[1] || 'Unknown'}</div>
        `;

        // JS Feature Tests
        const jsTests = document.getElementById('js-tests');
        const tests = {
            'ES6 Classes': () => { class Test {}; return true; },
            'Arrow Functions': () => { const fn = () => true; return fn(); },
            'Promises': () => typeof Promise !== 'undefined',
            'Fetch API': () => typeof fetch !== 'undefined',
            'localStorage': () => typeof localStorage !== 'undefined',
            'sessionStorage': () => typeof sessionStorage !== 'undefined',
            'Async/Await': () => { eval('(async () => {})'); return true; },
            'Spread Operator': () => { eval('[...[]]; return true;'); },
            'Optional Chaining': () => { eval('({}?.test); return true;'); },
            'Nullish Coalescing': () => { eval('(null ?? true); return true;'); }
        };

        let testResults = '';
        for (const [name, test] of Object.entries(tests)) {
            try {
                const result = test();
                testResults += `<div class="status ${result ? 'pass' : 'fail'}">${name}: ${result ? '✅ Pass' : '❌ Fail'}</div>`;
            } catch (e) {
                testResults += `<div class="status fail">${name}: ❌ Error - ${e.message}</div>`;
                console.error(`Test failed: ${name}`, e);
            }
        }
        jsTests.innerHTML = testResults;

        // API Test
        async function testAPI() {
            const result = document.getElementById('network-result');
            result.innerHTML = '<div class="status">Testing...</div>';
            
            try {
                const response = await fetch('https://amabakeryhouse.com/api/branch/', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                result.innerHTML = `
                    <div class="status pass">✅ Backend Connected!</div>
                    <div class="status">Status: ${response.status}</div>
                    <div class="status">Response: ${JSON.stringify(data).substring(0, 200)}...</div>
                `;
                console.log('API Test Success:', data);
            } catch (error) {
                result.innerHTML = `
                    <div class="status fail">❌ Connection Failed</div>
                    <div class="status">Error: ${error.message}</div>
                `;
                console.error('API Test Failed:', error);
            }
        }

        console.log('iPad Compatibility Test Loaded Successfully!');
    </script>
</body>
</html>
